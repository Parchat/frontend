name: Deploy Frontend-Develop to GCP VM

on:
  pull_request:
    types: [closed] # (mergeado)
    branches: [develop]

jobs:
  deploy:
    if: github.event.pull_request.merged == true # Solo si se hizo merge
    name: 🚀🛠 Deploy DEVELOP Next.js to GCP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop # Rama develop

      # 2. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalar dependencias, formatear y añadir a known_hosts
      - name: Install and format (No build in develop)
        run: |
          npm ci
          npm run format
      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      # 4. Detener docker-compose antes de la subida
      - name: Stop PM2 before upload
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd /home/proyectosdanils/
            sudo docker compose down

      # 5. Enviar archivos a la VM via SSH (usando rsync)
      - name: Deploy to develop GCP VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: '.'
          target: '/home/proyectosdanils/frontend-dev'
          port: 22
          rm: true
          debug: true

      # 6. Reiniciar docker en la VM
      - name: Restart Docker Compose
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd /home/proyectosdanils/
            sudo docker compose up -d --build
